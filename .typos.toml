# Spell-check configuration for this bootstrapped repository. Default
# dictionary on; the two seeded-proof quote words the folder READMEs
# carry are the only allowances a fresh repo needs.
[default.extend-identifiers]
recieve = "recieve"
calender = "calender"
# ratatui is the TUI crate's actual name; the port decision cites it.
ratatui = "ratatui"
# evn is the macro variable binding an event's name.
evn = "evn"
# The output belt's slide-overlap fixture sentinel: the ported
# update_from test pairs "baQ" against "ab" so the first-byte probe hits
# but the tails diverge; typos camel-splits the token and flags "ba".
baQ = "baQ"
# JSON fragments the utils suites pin verbatim from the upstream tests.
# Relace is the vendor name of the relace/relace-search model in the
# generated OpenRouter catalog shard (models.dev/OpenRouter data).
[default.extend-words]
tru = "tru"
Hel = "Hel"
Relace = "Relace"
relace = "relace"
# Yanked kill-ring fixtures the editor and input suites pin verbatim from
# the upstream tests (upstream's own FIRST/SECOND/SINGLE constants).
SECON = "SECON"
SINGL = "SINGL"
# The exact pi #1022 failing tool-call id the tool-call-id-normalization
# live suite pins verbatim from the upstream tests; typos splits the base64
# id body and flags the "UE" fragment.
UE = "UE"
# LaTeX command and environment names the latex renderer's command tables
# carry verbatim from the upstream tests (oint = \oint, multline = AMSMath,
# hom = \hom).
oint = "oint"
multline = "multline"
hom = "hom"
