# clippy noise control, per the house rule that every entry carries its
# measured why (AGENTS.md, "Comment and doc-comment rules").
#
# doc-valid-idents REPLACES clippy's default list unless the `..` sentinel
# appears, so the sentinel stays and the list holds only the house names the
# doc comments actually carry — spelled verbatim from the code, since the
# whole point is that prose may reference them bare. The tui slice #41 adds
# the upstream attribution and terminal names its doc comments carry bare
# (OpenTUI, XTVersion, WezTerm); the pi-ai port adds the provider names its
# wire docs carry bare; the tui slice #42 adds the two component class names
# its module docs carry bare.
doc-valid-idents = ["AcpClient", "OpenTUI", "OpenCode", "WKWebView", "XTVersion", "WezTerm", "OpenAI", "OpenRouter",
    "MiniMax", "MiMo", "DeepSeek", "SigV4", "vLLM", "SGLang", "ZDR",
    "AbortSignal", "UUIDv7", "HttpClient", "WeakMap", "serde_json",
    "CancellableLoader", "TruncatedText", ".."]