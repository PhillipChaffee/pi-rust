[package]
name = "pi-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI library with differential line-diff rendering, ported from @earendil-works/pi-tui"
license = "MIT"
repository = "https://github.com/PhillipChaffee/pi-rust"
readme = "README.md"
keywords = ["tui", "terminal", "ansi", "text", "coding-agent"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
crossterm = { version = "0.29", default-features = false }
emojis = "0.6"
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

# Raw-mode plumbing, size, and terminal state are crossterm's only roles
# (ADR 0001); the event reader stays off because the ported input parser owns
# byte decoding. The resize notification rides signal-hook's safe wrapper
# around the registry, and the start-time self-signal rides nix, because the
# workspace forbids the unsafe the raw libc/libuv-equivalent calls would need.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
signal-hook = "0.4"

[lints]
workspace = true