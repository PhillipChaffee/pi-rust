[package]
name = "pi-coding-agent"
version = "0.1.0"
edition = "2024"
description = "The pi coding agent product layer: config paths, session manager, tools, and CLI, ported from @earendil-works/pi-coding-agent"
license = "MIT"
repository = "https://github.com/PhillipChaffee/pi-rust"
readme = "README.md"
keywords = ["coding-agent", "ai", "cli", "terminal", "llm"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# The defaults module's `ThinkingLevel`, upstream's import from
# `@earendil-works/pi-agent-core`. The remaining ADR 0003 runtime edges
# (pi-tui, chord, pi-client, pi-protocol, pi-server) land with the
# tickets that first consume them.
pi-agent-core = { path = "../agent" }
# The base64 payloads the image and clipboard belts trade, upstream's
# Buffer.prototype.toString("base64").
base64 = "0.22"
# The session manager's wire codecs: the typed serde derives the entry
# vocabulary rides and the JSON value layer the raw-line parse keeps, both
# upstream's JSON.parse/stringify over the JSONL session files.
serde = "1"
# The abort belt's `RaceError`/`AbortError` vocabulary (the crate's
# `src/utils/abort.ts` is upstream's near-duplicate of ai's) and the
# `ImageContent`/`TextContent` shapes the tool-result-images belt carries.
pi-ai = { path = "../ai" }
# The TUI component contract the export's custom-tool renderers invoke and
# convert to HTML, upstream's `@earendil-works/pi-tui` import in
# `core/export-html/tool-renderer.ts` (ADR 0003 edge; first production
# consumer); the settings manager's TUI-facing setting types (`TuiMode`,
# `ScrollViewScrollbar`, the terminal capability overrides) ride it too.
pi-tui = { path = "../tui" }
# JSON; the stores serialize their wire-faithful shapes with serde_json, key
# order preserved so saved files match upstream's insertion order. The
# session entries' extras flatten rides the same order-preserved map for
# wire round-trips.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
# The JS `Map` semantics the runtime-credential enumeration rides:
# insertion order, an overwrite keeping the original position.
indexmap = "2"
# The async substrate the stack decision pins. sync: the CancellationToken
# abort plumbing and channels; time: sleep and the child-stdio grace timer;
# macros: the select! races; process: child processes; rt: spawn_blocking
# handoffs (upstream's worker threads); io-util: child stdout/stderr readers.
tokio = { version = "1.47", default-features = false, features = [
  "rt",
  "sync",
  "time",
  "macros",
  "process",
  "io-util",
] }
# The CancellationToken the abort belt carries, the same token pi-ai's
# transport options take.
tokio-util = { version = "0.7", default-features = false }
# ansi: strip-ansi's sequence grammar; json: the comment/trailing-comma
# stripping passes upstream expresses as two RegExp passes.
regex = "1.11"
# frontmatter: SKILL.md/prompt-template YAML, upstream's npm `yaml`.
yaml-rust2 = "0.13"
# file:// URL normalization in the path belt (node's `fileURLToPath`) and
# the hosted-git URL grammar, both WHATWG URL parsing like node's `URL`.
url = "2.5"
# The image surface, the restatement of the photon-node WASM module (decode
# BMP/JPEG/GIF/WebP/PNG, Lanczos3 resize, PNG/JPEG encode).
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
] }
# The native clipboard, the replacement pi-tui's decision #51 chose; its
# first consumer is this crate (upstream's `getNativeClipboard`).
arboard = "3.6"
# The WSL clipboard-image bridge's temp-file name, upstream's `randomUUID`.
uuid = { version = "1.26", features = ["v4"] }
# The auth store's contended-lock backoff jitter, upstream's `Math.random`.
rand = "0.9"
# fs-watch: the settings/models.json file watchers, upstream's node `fs.watch`.
notify = "8"
# syntax-highlight, the restatement of highlight.js: the Sublime syntax
# engine with the pure-Rust fancy-regex backend (no onig), over two-face's
# extended syntax set (the eager languages include nix, which the Sublime
# default set lacks).
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
# The semver compare the version-check belt and the `crate:` package channel
# ride (upstream npm `semver`'s `valid`/`compare`/`gt`).
semver = "1"
# The sha256 the temporary-dir hash and the install receipts carry
# (upstream's `node:crypto.createHash("sha256")`).
sha2 = "0.10"
# The manifest-entry globs the package manager's collectors expand and the
# package sources' pattern machinery consumes, upstream's npm `glob`
# (`globSync`). The ignore rules the collectors walk under restate npm
# `ignore` through this crate's matcher (the skills loader's substitution).
glob = "0.3"
# The managed-install and tarball channel's gzip layer, upstream's npm
# tarballs (moved up from dev, where only the PNG fixture builder used it).
flate2 = "1"
# The tarball channel's unpack, upstream's npm package tarballs; the safety
# rules (traversal/symlink rejection, size caps) wrap it in this crate.
tar = "0.4"
# The concurrent check/update pool's stream driving, the same futures-util
# slice pi-ai's seam rides.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# The discovery walk's ignore-file matcher, upstream's npm `ignore` — the
# same substitution the skills loader made.
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
# The process-tree kill the shell belt performs on shutdown, upstream's
# `process.kill(-pid, "SIGKILL")`: the workspace forbids the unsafe raw
# libc/libuv-equivalent calls, so the signal rides nix's safe wrapper,
# matching the agent and tui crates' signal handling. The fs feature adds
# the `access` W_OK probe the self-update writability check rides.
nix = { version = "0.31", default-features = false, features = ["signal", "fs"] }

[dev-dependencies]
# Scratch directories the session-cwd suites probe for existence.
tempfile = "3"
# The PNG fixture builder's deflate, upstream's `node:zlib.deflateSync`.
flate2 = "1"
# The truncate-to-width suite drives pi-tui's renderer helpers, upstream's
# `@earendil-works/pi-tui` import in `test/truncate-to-width.test.ts`.
pi-tui = { path = "../tui" }
# macros/rt/sync/time: the current-thread runtime and the select!/sleep
# races; test-util: the paused clock the clipboard timeout test drives.
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time", "test-util"] }

# Upstream's `pi` bin target; the name is provisional per the map's
# packaging fog. The CLI grammar and mode dispatch land with their tickets.
[[bin]]
name = "pi"
path = "src/main.rs"

[lints]
workspace = true