[package]
name = "pi-agent-core"
version = "0.1.0"
edition = "2024"
description = "Transport-abstracted agent runtime: the agent loop, Agent class, and harness runtime, ported from @earendil-works/pi-agent-core"
license = "MIT"
repository = "https://github.com/PhillipChaffee/pi-rust"
readme = "README.md"
keywords = ["agent", "llm", "coding-agent", "ai", "streaming"]
categories = ["development-tools"]

[dependencies]
# The dominant upstream edge: message/model/usage types, the EventStream the
# loop returns, the StreamFn contract's `Models.streamSimple` shape, and the
# tool-argument validation the preflight runs.
pi-ai = { path = "../ai" }
# The harness Context seam: chord's ported Context/ContextKey/AbortSignal is
# the explicit invocation context every harness API carries (map ticket
# "pi-agent-core: harness foundations").
pi-chord = { path = "../chord", package = "pi-chord" }
# The telemetry schema vocabulary and the dispatch handle cross crate
# boundaries per ADR 0004.
pi-telemetry = { path = "../telemetry" }
# The AgentMessage extension surface and custom-message persistence are owned
# JSON; the crate serializes its wire-faithful shapes with serde.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
# The abort plumbing the stack decision pins: hook and tool signatures carry
# the same cancellation token pi-ai's transport options do.
tokio-util = { version = "0.7", default-features = false }
# tokio: the async substrate the stack decision pins. rt: `agent_loop` fires
# its run on a spawned task (upstream's `void runAgentLoop(...)`) and parallel
# tool execution spawns one task per prepared call. sync: the channels and
# watch/oneshot primitives the ordered delivery tails collapse into, and the
# Agent's idle waiters (upstream's per-run `waitForIdle` promise); time: the
# output publisher's trailing timer and the shell exec timeout; process: the
# nodejs execution environment's child processes; fs: the environment's file
# operations; io-util: the child stdout/stderr readers.
tokio = { version = "1.47", default-features = false, features = [
  "rt",
  "sync",
  "time",
  "process",
  "fs",
  "io-util",
] }
# The skills loader's ignore-file engine (.gitignore/.ignore/.fdignore),
# upstream's npm `ignore` dependency: the crate's gitignore machinery with
# npm's default case-insensitivity and its parent-first walk re-expressed
# over `Gitignore::matched` (see the skills module's IgnoreMatcher).
ignore = "0.4"
# SKILL.md and prompt-template frontmatter parsing, upstream's npm `yaml`
# dependency: yaml-rust2 rejects the same malformed inputs (unterminated flow
# sequences, duplicate keys) the `yaml` parse throws on.
yaml-rust2 = "0.13"
# The path resolution variants and the fuzzy-match normalizer's NFKC pass,
# upstream's `String.prototype.normalize`.
unicode-normalization = "0.1"
# The read tool's base64 image attachments, upstream's hand-rolled
# `encodeBase64` (Buffer.prototype.toString("base64")).
base64 = "0.22"

[dev-dependencies]
# macros: the test attribute macro; rt: the current-thread runtime the
# single-threaded substrate expects; time: the paused clock for ordered
# settlement tests; process: the nodejs execution environment's shell probes;
# sync: the oneshot/Notify release gates the tool execution-order tests drive;
# test-util: the clock pause itself.
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time", "process", "test-util"] }
# tempfile: the execution-environment suites' scratch roots.
tempfile = "3"
# The chunk type of the seam's byte streams; the proxy boundary suite's
# signal-ignoring client builds canned chunk bodies with it.
bytes = "1.12"
# The Stream trait of the seam's byte streams; the proxy boundary suite's
# gated body (chunk, suspension, end) implements it by hand.
futures-core = "0.3"

[lints]
workspace = true
# The process-tree kill the nodejs execution environment performs on abort,
# timeout, and cleanup: the workspace forbids the unsafe raw libc/libuv-
# equivalent calls, so the signal rides nix's safe wrapper, matching the tui
# crate's signal handling.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
