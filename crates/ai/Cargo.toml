[package]
name = "pi-ai"
version = "0.1.0"
edition = "2024"
description = "Unified LLM layer with provider collections, OAuth resolution, token and cost tracking, ported from @earendil-works/pi-ai"
license = "MIT"
repository = "https://github.com/PhillipChaffee/pi-rust"
readme = "README.md"
keywords = ["llm", "ai", "providers", "streaming", "coding-agent"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
pi-telemetry = { path = "../telemetry" }
serde = { version = "1.0.219", features = ["derive"] }
# preserve_order: JSON objects keep their insertion order like JS objects do,
# which the wire payloads and the serialized-arguments comparisons rely on.
serde_json = { version = "1.0.145", features = ["preserve_order"] }

# regex: the overflow and retry classifiers are provider error-message
# grammars upstream expresses as case-insensitive RegExp lists.
regex = "1.11"
# tokio + tokio-util: the async substrate the stack decision pins —
# cancellable sleeps, the CancellationToken port of AbortSignal, and the
# oneshot waiters behind EventStream.
tokio = { version = "1.47", default-features = false, features = ["sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7", default-features = false }
# url: WHATWG URL parsing for proxy resolution, matching node's URL.
url = "2.5"
# getrandom: crypto.getRandomValues for the uuidv7 tail.
getrandom = "0.3"
# sha2: the model-data manifest hashes, matching node:crypto's sha256 hex.
sha2 = "0.10"
# rustix: the kernel release for the pi user agent, through a safe API.
rustix = { version = "1.1", default-features = false, features = ["std", "system"] }
# http: the HttpClient seam substrate (reqwest 0.12 + rustls per the stack
# decision). rustls-tls pins the TLS stack and ships webpki roots in place of
# Node's bundled CA store; system-proxy keeps env proxies honored the way the
# Bun runtime upstream also ships on does; the compression features stand in
# for undici's automatic gzip/brotli/deflate body handling; charset covers
# non-UTF-8 content types the way TextDecoder did.
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
  "gzip",
  "brotli",
  "deflate",
  "stream",
] }
# bytes: the chunk type of the seam's byte streams, reqwest's own chunk type,
# so responses stream without copies.
bytes = "1.12"
# futures-core/futures-util: the Stream trait of the seam's byte streams and
# the combinators the reqwest and tungstenite adapters wrap them with; both
# are runtime-free foundation crates already in the graph.
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# tokio-tungstenite: the WebSocket transport the stack decision pins for the
# Codex wire API, rustls-tls-webpki-roots matching the reqwest trust store;
# the WebSocket constructor global upstream (`src/api/openai-codex-responses.ts:992`)
# ports to this, not to a `ws`-family dependency.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }

[dev-dependencies]
# test-util: the paused clock the provider-retry tests drive, the fake-timer
# port per the stack decision. net + io-util: the loopback HTTP and WebSocket
# servers the seam and transport tests run against.
tokio = { version = "1.47", features = ["test-util", "net", "io-util"] }

[lints]
workspace = true