[package]
name = "pi-ai"
version = "0.1.0"
edition = "2024"
description = "Unified LLM layer with provider collections, OAuth resolution, token and cost tracking, ported from @earendil-works/pi-ai"
license = "MIT"
repository = "https://github.com/PhillipChaffee/pi-rust"
readme = "README.md"
keywords = ["llm", "ai", "providers", "streaming", "coding-agent"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
pi-telemetry = { path = "../telemetry" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["macros", "rt", "sync"] }

[lints]
workspace = true