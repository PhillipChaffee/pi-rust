# gitleaks configuration. The default ruleset runs as-is; this repository has
# no allowlist entries. Add one only with a reason (for example, a test
# fixture that carries a fake credential on purpose).
[extend]
useDefault = true
# The ported providers' generated catalog carries vendor metadata, and every
# ported file cites the upstream pin commit in its header — the runtime
# modules under src/ and the ported test suites under tests/ alike. Three
# false positives result, all content hashes, not credentials (#28):
#   1. .manifest.json holds per-shard SHA-256 file hashes; shard names like
#      qwen-token-plan.json contain "token", tripping generic-api-key.
#   2. Modules whose ids contain "sgp_" (the Xiaomi Token Plan SGP) put the
#      sourcegraph keyword in the scan chunk, and every file cites the 40-hex
#      pin SHA.
# The allowlist targets the hash-shaped matches only, so a real credential
# anywhere in these files still reports.
[[allowlists]]
description = "generated catalog hashes and upstream pin SHAs are content, not credentials"
paths = [
    '^crates/ai/src/providers/data/[.]manifest[.]json$',
    '^crates/ai/src/.*[.]rs$',
    '^crates/ai/tests/.*[.]rs$',
]
regexTarget = "match"
regexes = [
    '"[a-z0-9-]+[.]json":"[a-fA-F0-9]{64}"',
    '^[a-fA-F0-9]{40}$',
]
# The run-gates local scan walks the working tree, where target/ holds
# compiled artifacts embedding the same content CI's git-mode scan already
# gates. Ignoring the artifacts keeps the local gate aligned with CI without
# weakening the scan of real sources.
[[allowlists]]
description = "build artifacts are gitignored and never reach the tracked tree"
paths = [
    '^target/',
]
