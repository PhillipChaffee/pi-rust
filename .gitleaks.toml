# gitleaks configuration. The default ruleset runs as-is; the allowlist
# below covers build output only: rustdoc's search index embeds random
# base64 tokens that match credential detectors, and the target directory
# is a build artifact, never a source file. Add further entries only with a
# reason (for example, a test fixture that carries a fake credential on
# purpose).
[extend]
useDefault = true

[allowlist]
description = "Build artifacts: rustdoc's generated search index is not source"
paths = ['^target/']
